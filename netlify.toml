# Netlify build configuration.
#
# The client is a Vite build; the API lives in the Vite middleware stack, so a
# static Netlify deploy serves the app shell and its assets (public/_redirects
# carries the SPA fallback).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# The API lives in the Vite middleware stack. The function mounts the same
# provider middleware, so the deployed site answers /api/* the way the dev
# server does.
[functions]
  directory = "netlify/functions"
